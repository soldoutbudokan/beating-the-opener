name: Research process checks

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'research/**'
      - 'cricket/research/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'research/**'
      - 'cricket/research/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /tests/
            /research/
            /cricket/research/
      - name: Install pinned research dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r research/engine/requirements.txt
      - name: Run arithmetic, source, timing and model invariance checks
        run: .venv/bin/python -m unittest discover -s tests -v
